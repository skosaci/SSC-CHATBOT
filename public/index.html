<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask SSC | Student Success Center</title>
<style>
:root{--navy:#004a8c;--navy-d:#00315e;--ink:#17263a;--mute:#5b6b7f;--bg:#f3f6fa;--card:#fff;--line:#d9e1ec;--gold:#f0b429;--r:14px}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef6;--mute:#9db0c6;--bg:#0f1824;--card:#16233a;--line:#2a3b52}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.demo{max-width:640px;margin:0 auto;padding:12vh 24px}
.demo h1{font-size:2rem;line-height:1.2;margin:0 0 12px;color:var(--navy)}
@media(prefers-color-scheme:dark){.demo h1{color:#8ec2ff}}
.demo p{color:var(--mute)}
#fab{position:fixed;right:20px;bottom:20px;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 20px;background:var(--navy);color:#fff;font:600 1rem inherit;cursor:pointer;box-shadow:0 8px 24px #00315e55}
#fab:hover{background:var(--navy-d)}
#panel{position:fixed;right:20px;bottom:84px;width:400px;max-width:calc(100vw - 24px);height:min(640px,calc(100dvh - 110px));display:none;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px #0003;overflow:hidden}
#panel.open{display:flex}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}
header b{display:block;font-size:1.05rem}header small{opacity:.85}
header button{background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:var(--r);word-wrap:break-word}
.m p{margin:0 0 .5em}.m p:last-child{margin:0}.m ul{margin:.3em 0;padding-left:1.2em}
.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.err{background:#fde8e8;color:#8a1c1c;border:1px solid #f3b7b7;align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.chips button{border:1px solid var(--navy);background:transparent;color:var(--navy);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
@media(prefers-color-scheme:dark){.chips button{color:#8ec2ff;border-color:#8ec2ff}}
.chips button:hover{background:var(--navy);color:#fff}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;background:transparent;color:var(--ink);max-height:90px}
form button{border:0;border-radius:10px;padding:0 16px;background:var(--navy);color:#fff;font:600 1rem inherit;cursor:pointer}
form button:disabled{opacity:.5;cursor:default}
.note{font-size:.72rem;color:var(--mute);text-align:center;padding:0 12px 8px;background:var(--card)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:480px){#panel{right:0;bottom:0;width:100vw;max-width:100vw;height:100dvh;border-radius:0}#fab{right:14px;bottom:14px}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
</head>
<body>
<main class="demo">
  <h1>Student Success Center</h1>
  <p>Demo page. Open the chat in the bottom-right corner. See the README for adding it to your website.</p>
</main>

<button id="fab" aria-expanded="false" aria-controls="panel">💬 Ask SSC</button>
<section id="panel" role="dialog" aria-label="Ask SSC chat">
  <header><div><b>Ask SSC</b><small>Your Student Success Companion</small></div><button id="close" aria-label="Close chat">×</button></header>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="f">
    <textarea id="t" rows="1" maxlength="1000" placeholder="Type your question… / Sorunuzu yazın…" aria-label="Your message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="note">AI assistant. For official details, check the SSC pages or visit E Block, 1st floor.</div>
</section>

<script>
const $=id=>document.getElementById(id);
const panel=$("panel"),fab=$("fab"),log=$("log"),t=$("t"),send=$("send");
const history=[];let busy=false,started=false;
const CHIPS={"Academic Support":"What is academic support at the SSC and how can it help me?","Speaking Clubs":"Tell me about the SSC speaking clubs.","Mentoring":"What is mentoring at the SSC?","Workshops":"What workshops does the SSC offer?","Activities":"What student engagement activities does the SSC have?","Study Tips":"Give me some effective study tips.","Practise English":"I want to practise English. Can you help me?","Learning Materials":"How can I practise English on my own? Suggest materials for my level."};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(s){let h=esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 h=h.replace(/(?:^|\n)((?:[-*•] .+(?:\n|$))+)/g,(m,b)=>"\n\n<ul>"+b.trim().split("\n").map(l=>"<li>"+l.slice(2)+"</li>").join("")+"</ul>\n\n");
 return "<p>"+h.trim().split(/\n{2,}/).join("</p><p>").replace(/\n/g,"<br>")+"</p>"}
function add(cls,html){const d=document.createElement("div");d.className="m "+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function toggle(v){panel.classList.toggle("open",v);fab.setAttribute("aria-expanded",v);
 if(v){if(!started){started=true;
  add("bot","<p>Hi! 👋 I'm <strong>Ask SSC</strong>, the AI assistant of the Student Success Center.</p><p>I can tell you about SSC services, give study tips and help you practise English. Türkçe de yazabilirsiniz. What would you like to explore?</p>");
  Object.entries(CHIPS).forEach(([k,q])=>{const b=document.createElement("button");b.type="button";b.textContent=k;b.onclick=()=>ask(q);$("chips").appendChild(b)})}
  t.focus()}else fab.focus()}
async function ask(text){
 text=text.trim();if(!text||busy)return;
 busy=true;send.disabled=true;$("chips").style.display="none";
 add("me",esc(text));history.push({role:"user",content:text});t.value="";
 const wait=add("bot",'<span class="dots" role="status" aria-label="Assistant is typing"><span></span><span></span><span></span></span>');
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===429?"Too many messages. Please wait a minute and try again.":"The assistant is unavailable right now. Please try again, or check the SSC pages directly.");
  wait.innerHTML=md(j.reply||"Sorry, I could not answer that.");history.push({role:"assistant",content:j.reply||"..."});
 }catch(e){wait.className="m err";wait.textContent=e.message==="Failed to fetch"?"No connection. Check your internet and try again.":e.message;history.pop()}
 busy=false;send.disabled=false;log.scrollTop=log.scrollHeight;t.focus()}
fab.onclick=()=>toggle(!panel.classList.contains("open"));
$("close").onclick=()=>toggle(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&panel.classList.contains("open"))toggle(false)});
$("f").onsubmit=e=>{e.preventDefault();ask(t.value)};
t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(t.value)}});
</script>
</body>
</html>
